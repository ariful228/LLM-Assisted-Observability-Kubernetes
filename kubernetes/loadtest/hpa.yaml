# HorizontalPodAutoscaler for the load-test workload.
# Scales on sustained CPU (averageUtilization of the 200m CPU request).
# Responds quickly on scale-up (0s stabilization, +100% pods / 30s) so a
# Locust burst visibly bumps replica count within ~1 minute.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: locust-demo
  namespace: ai-observability-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: locust-demo
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60