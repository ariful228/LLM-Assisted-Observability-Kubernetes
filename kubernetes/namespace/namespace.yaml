apiVersion: v1
kind: Namespace
metadata:
  name: ai-observability-demo
  annotations:
    observability.llm/description: "AI-assisted observability & security demo namespace"
  labels:
    app.kubernetes.io/part-of: ai-observability-demo
    # Falco (privileged hostPath container for kernel-event capture) requires
    # more than baseline — enforce "privileged" in this single-node demo cluster.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform
  namespace: ai-observability-demo
  annotations:
    observability.llm/purpose: "Runs the AI observability platform; needs read access to the cluster"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: observability-aggregator
  namespace: ai-observability-demo
  annotations:
    observability.llm/purpose: "Collects Falco + audit events from the cluster"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: allowlisted-service-account
  namespace: ai-observability-demo
  annotations:
    observability.llm/purpose: "Allowlisted SA referenced by the platform policy allowlists"