route:
  receiver: team-ai-platform
  group_by: ["alertname", "namespace", "incident_type"]
  group_wait: 15s
  group_interval: 1m
  repeat_interval: 3h

receivers:
  - name: team-ai-platform
    webhook_configs:
      # The platform exposes /api/incidents/ingest to turn validated alerts into incidents.
      - url: http://platform:8199/api/incidents/ingest
        send_resolved: true
inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="high"]
    equal: [pod, namespace]